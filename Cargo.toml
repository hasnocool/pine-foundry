[package]
name = "pine-foundry"
version = "0.1.0"
description = "Local-first real-time market scanner"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
quick-xml = "0.42"
urlencoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
